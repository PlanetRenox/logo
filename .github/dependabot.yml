version: 2
updates:
  - package-ecosystem: bun
    directories:
      - "/designs/planet-in-progress/versions/gray"
      - "/designs/planet-in-progress/versions/tiles"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      bun-minor-and-patch:
        update-types:
          - minor
          - patch
